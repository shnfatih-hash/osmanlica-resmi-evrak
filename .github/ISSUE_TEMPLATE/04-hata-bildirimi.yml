name: "🐛 Hata / Tarih Dönüşümü / Betik Sorunu Bildirimi"
description: "tarih_cevirici.py, evrak_bolge_kesici.py, sozluk_ve_html_uretici.py veya transkripsiyon kurallarında hata bildirin."
title: "[Hata] "
labels: ["hata"]
body:
